name: Train and Test Model
on:
  push:
    branches: [main]
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt lightgbm plotly statsmodels
      - name: Train model with synthetic data
        run: python training/train_model.py --synthetic
      - name: Verify model artifacts
        run: ls model/
      - name: Run tests (31 tests)
        run: python -m pytest -q
